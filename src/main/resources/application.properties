spring.application.name=UnityTrust-1

# =====================
# SERVER (Fly.io)
# =====================
server.port=${PORT:8080}
server.address=0.0.0.0

# =====================
# ACTUATOR (Health)
# =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# =====================
# MAIL CONFIG (Gmail SMTP)
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:unitytrustbank.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =====================
# DATABASE (AWS RDS MySQL)
# =====================

# Replace endpoint below with your actual RDS endpoint
# Example:
# database-1.xxxxx.ap-south-1.rds.amazonaws.com

spring.datasource.url=jdbc:mysql://YOUR_RDS_ENDPOINT:3306/unitytrustbank?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.username=admin
spring.datasource.password=2YcyrDWhjIHQse9YObne

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# HIKARI CONNECTION POOL
# =====================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =====================
# JPA / HIBERNATE
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# LOGGING
# =====================
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc=WARN
logging.level.org.hibernate.SQL=OFF

# =====================
# SWAGGER / OPENAPI
# =====================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =====================
# FILE UPLOADS
# =====================
file.kyc.path=/tmp/uploads/kyc

spring.servlet.multipart.location=/tmp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# =====================
# JACKSON
# =====================
spring.jackson.serialization.fail-on-empty-beans=false

# =====================
# ERROR HANDLING
# =====================
server.error.include-message=always
server.error.include-binding-errors=always

# =====================
# TOMCAT
# =====================
server.tomcat.max-swallow-size=20MB
server.tomcat.connection-timeout=20000
