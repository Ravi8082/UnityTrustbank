spring.application.name=UnityTrust-1

# =====================
# SERVER (Fly.io)
# =====================
server.port=${PORT:8080}
server.address=0.0.0.0

# =====================
# ACTUATOR (Health)
# =====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoints.web.base-path=/actuator

# =====================
# MAIL CONFIG (Gmail SMTP)
# =====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:unitytrustbank.noreply@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =====================
# DATABASE (TiDB Cloud - MySQL)
# =====================
spring.datasource.url=${DB_URL:jdbc:mysql://gateway01.ap-southeast-1.prod.aws.tidbcloud.com:4000/unitytrustbank?sslMode=REQUIRED}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}

# =====================
# JPA / Hibernate
# =====================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off

# If dialect issue comes, uncomment:
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =====================
# Swagger / OpenAPI
# =====================
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# =====================
# FILE UPLOADS
# =====================
file.kyc.path=${KYC_PATH:/tmp/uploads/kyc}
spring.servlet.multipart.location=${MULTIPART_TMP:/tmp}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:15MB}

# =====================
# LOGGING
# =====================
logging.level.root=${LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:INFO}
logging.level.org.springframework.jdbc=${SPRING_JDBC_LOG_LEVEL:WARN}
